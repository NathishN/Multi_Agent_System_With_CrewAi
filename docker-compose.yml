services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-advisor-backend
    env_file:
      - .env
    environment:
      - CREW_VERBOSE=false
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stock-advisor-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
